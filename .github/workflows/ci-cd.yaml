name: Django CI/CD

on:
  push:
    branches:
      - dev

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Authenticate GCP
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Configure Docker
      run: gcloud auth configure-docker asia-south1-docker.pkg.dev

    - name: Build Docker Image
      run: |
        docker build -t asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/github-vc/django-app .

    - name: Push Docker Image
      run: |
        docker push asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/github-vc/django-app

    - name: Deploy to VM
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VM_IP }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          echo '${{ secrets.GCP_SA_KEY }}' > /tmp/gcp-key.json
          sudo gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
          sudo gcloud auth configure-docker asia-south1-docker.pkg.dev
          sudo docker pull asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/github-vc/django-app
          sudo docker stop django-app || true
          sudo docker rm django-app || true
          sudo docker run -d -p 80:8000 --name django-app asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/github-vc/django-app